<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCI Productions</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081C33" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCI Productions">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}#ptr{position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:var(--surface);color:var(--muted);font-weight:600;font-size:13px;border-bottom:1px solid var(--line);transition:height .12s ease;padding-top:env(safe-area-inset-top,0px)}
#ptr span{padding:0 0 12px}
#ptr.ready{color:var(--accent)}
.pill.new-pill{background:var(--accent);color:var(--accent-ink);font-size:10.5px;padding:1px 7px;vertical-align:2px;margin-right:4px}
.add-tile{border-style:dashed;border-color:var(--accent)}
.add-tile .add-av{background:var(--accent-soft);color:var(--accent);font-size:30px;font-weight:400;display:grid;place-items:center}
.add-tile .meta b{color:var(--accent)}
.access-panel{border-color:var(--accent);background:var(--accent-soft)}
.access-panel .actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: single-column phone-first app shell — sticky header, stacked "cue cards", fixed bottom tab bar (mirrors the Power App's nav). */
:root{
  /* Brand: RCI navy #072442 and gold #BD9863 from the church logo */
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E7EBF2; --line:#D3DAE5;
  --fg:#0B1D33; --muted:#566479; --accent:#8A6631; --accent-ink:#FFFFFF; --accent-soft:#F4EBDD;
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --warn:#8A5A00; --warn-soft:#FBEBCD; --bad:#B3261E; --bad-soft:#F9DEDC;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
  --go:#1E8A52; --stop:#C62828; --blue:#0B3A6E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#03111F; --surface:#081C33; --surface-2:#0E2845; --line:#1A3555;
  --fg:#EEF2F7; --muted:#A3B2C6; --accent:#D2B07C; --accent-ink:#03111F; --accent-soft:#252C38; --blue:#2B6CB0;
  --ok:#5CCB8F; --ok-soft:#0F2E2A; --warn:#E3B866; --warn-soft:#2E2A20; --bad:#F2877F; --bad-soft:#33202C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#03111F; --surface:#081C33; --surface-2:#0E2845; --line:#1A3555;
  --fg:#EEF2F7; --muted:#A3B2C6; --accent:#D2B07C; --accent-ink:#03111F; --accent-soft:#252C38; --blue:#2B6CB0;
  --ok:#5CCB8F; --ok-soft:#0F2E2A; --warn:#E3B866; --warn-soft:#2E2A20; --bad:#F2877F; --bad-soft:#33202C; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:16px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;background:none;border:none;padding:0;cursor:pointer;color:inherit}
.wm{height:52px;width:auto;max-width:100%;display:block;object-fit:contain;object-position:left center}
.wm-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wm-light{display:none}:root:not([data-theme="light"]) .wm-dark{display:block}}
:root[data-theme="dark"] .wm-light{display:none}
:root[data-theme="dark"] .wm-dark{display:block}
.center-screen .wm{height:auto;width:min(280px,80%);object-position:center;margin-inline:auto;align-self:center}
.install{display:flex;flex-direction:column;gap:8px}
.install p{margin:0;color:var(--muted);font-size:14px}
.install b{color:var(--fg)}
.brand b{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:18px;height:18px}

main{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:18px;padding-block:20px}

.demo{background:var(--accent-soft);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.demo strong{color:var(--accent)}

h1.greet{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,40px);line-height:1.02;letter-spacing:.01em;text-wrap:balance;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.page-h{display:flex;align-items:center;gap:10px}
.page-h h1{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:.02em;margin:0;text-wrap:balance}
.back{background:none;border:none;color:var(--muted);display:flex;align-items:center;gap:4px;padding:6px 8px 6px 0;font-weight:600}
.back svg{width:18px;height:18px}

.section-label{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.count{font-size:12px;font-weight:700;letter-spacing:0;background:var(--surface-2);color:var(--fg);border-radius:999px;padding:1px 8px}
.count.hot{background:var(--stop);color:#FFFFFF}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.announce p{margin:0}
.ann-card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:12px 12px 12px 14px}
.ann-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ann-title{font-weight:700;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.ann-text{margin:0;white-space:pre-line;color:var(--muted);font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.ann{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.ann li{padding-left:14px;position:relative;font-weight:500;display:flex;flex-direction:row;align-items:flex-start;gap:12px}
.ann li > span{flex:1;min-width:0}
.ann-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:6px;font-size:13px;font-weight:500;color:var(--muted)}
.ann-meta .linkbtn{margin:0;padding:0}
.iconbtn.edit-on{background:var(--go);border-color:var(--go);color:#FFFFFF}
.ann-form{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.ann-form-h{margin:0;font-family:var(--display);font-size:20px;letter-spacing:.02em}
.ann-form .hint{font-weight:400}
.flyer-picked{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.flyer-picked img{width:56px;height:70px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.flyer{display:block;flex:none;width:clamp(84px,28%,140px);padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.flyer img{display:block;width:100%;height:auto;max-height:200px;object-fit:cover;object-position:top;background:var(--surface-2)}
.flyer-load{display:block;padding:18px 6px;color:var(--muted);font-size:12px;font-weight:500;text-align:center}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:calc(48px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-close{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:26px;line-height:1}
.ann li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.bday-panel{display:flex;flex-direction:column;gap:12px;border-color:var(--accent)}
.bday-row{border-color:var(--accent)}
.bday-wrap{position:relative}
.bday-wrap .person{padding-right:56px}
.chat-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:34px;height:34px;color:var(--accent);border-color:var(--accent);background:transparent}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chat-btn{color:#fff;border-color:#fff}}
:root[data-theme="dark"] .chat-btn{color:#fff;border-color:#fff}
.chat-btn svg{width:17px;height:17px}
.date-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.date-chip{flex:none;display:flex;flex-direction:column;align-items:center;min-width:54px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.date-chip b{font-size:20px;line-height:1.1;letter-spacing:0}
.date-chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.admin-row{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.admin-row.c2{padding:12px 14px;gap:10px}
.c2-main{display:flex;align-items:flex-start;gap:12px;min-width:0}
.c2-face .av.face{width:64px;height:64px;font-size:20px}
.c2-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.c2-name{font-size:16.5px;line-height:1.2;overflow-wrap:anywhere}
.c2-pos{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.02em;color:var(--accent);line-height:1.15;overflow-wrap:anywhere}
.c2-sub{font-size:12.5px;margin:0}
.c2-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.c2-btns{display:flex;gap:6px}
.c2-btns .iconbtn{width:36px;height:36px}
.c2-btns .iconbtn svg{width:17px;height:17px}
.c2 .iconbtn.save-btn:not(:disabled){background:transparent;border:2px solid var(--accent);color:var(--accent)}
.admin-row.c2.locked .c2-face .av{opacity:.75}
.c2-face .av.face{width:58px;height:58px;font-size:18px}
.c2-namepick{position:relative;display:block;cursor:pointer;line-height:1.25}
.c2-namepick .c2-name{display:inline}
.admin-row.c2.locked .c2-namepick{cursor:default}
.admin-row.c2.locked .c2-dd{display:none}
.c2-dd{display:inline-grid;vertical-align:-4px;margin-left:4px;place-items:center;width:22px;height:22px;background:none;border:none;box-shadow:none;color:var(--fg);flex:none}
.c2-dd svg{width:16px;height:16px;transform:rotate(90deg)}
.c2-dd.inline-dd{display:inline-grid;width:20px;height:20px;vertical-align:-4px}
.c2-dd.inline-dd svg{width:11px;height:11px}
.c2-sel{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.c2-sel:disabled{display:none}
.c2-pub{display:flex;align-items:center;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.c2-pub > span{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;flex:none}
.c2-pub select{flex:1;min-width:0;padding:6px 10px;min-height:34px;font-size:14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
.admin-row.c2.locked .c2-pub select{opacity:.55}
.admin-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.admin-title{display:flex;flex-direction:column;gap:1px;min-width:0}
.admin-title .times{margin-top:2px;gap:0 14px}
.admin-side{display:flex;flex-direction:row;align-items:center;gap:6px;flex:none}
.admin-side .iconbtn{width:30px;height:30px}
.admin-side .iconbtn svg{width:15px;height:15px}
/* Edit Schedule tiles (same layout as RCI Worship & Arts): several side by side */
.admin-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.admin-row.admin-tile{padding:8px;gap:6px;min-width:0}
.tile-bar{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.tile-bar .pill{font-size:10.5px;padding:2px 7px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tile-btns{display:flex;gap:4px;flex:none;margin-left:auto}
.tile-btns .iconbtn{width:28px;height:28px}
.tile-btns .iconbtn svg{width:14px;height:14px}
.tile-who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;min-width:0}
.tile-who .av.face,.tile-who .av{width:52px;height:52px;font-size:16px}
.tile-name{font-size:14.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile-sub{font-size:11.5px;color:var(--muted);line-height:1.2}
.tile-fields{display:flex;flex-direction:column;gap:5px}
.tile-f{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-f > span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile-f select{width:100%;min-width:0;padding:5px 8px;min-height:34px;font-size:13px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px}
.tile-f .field-tag{display:flex;justify-content:center;margin-top:3px}
.tile-f .hint{font-size:11px}
.admin-tile.locked select{opacity:.55}
.abs-tile{border-color:var(--bad);background:var(--bad-soft)}
.abs-tile .tile-bar{justify-content:center}
.role-sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;padding:2px 0;color:inherit;cursor:pointer;text-align:left;font:inherit}
.sec-head .section-label{margin:0;flex:1}
.sec-chev{display:grid;place-items:center;color:var(--muted);flex:none}
.sec-chev svg{width:16px;height:16px;transform:rotate(90deg);transition:transform .15s}
.sec-head[aria-expanded="false"] .sec-chev svg{transform:none}
.sub-sec{padding-left:10px;border-left:2px solid var(--line)}
.sub-sec .section-label{font-size:13px}
.tile.abs-tile{border-color:var(--bad);background:var(--bad-soft)}
.tile.abs-tile small{color:var(--bad)}

.role-sec + .role-sec{margin-top:10px}
.role-sec .section-label{margin:0}
.admin-tile.locked .tile-who .av{opacity:.7}
.admin-tile .del-ask{flex-direction:column;align-items:stretch;gap:6px;font-size:13px;background:var(--bad-soft);border-radius:8px;padding:8px}
.admin-tile .del-ask .btn{justify-content:center;padding:6px 8px}

.iconbtn.del-btn{color:var(--bad);border-color:var(--bad);background:transparent}
.del-ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--bad);font-weight:600;font-size:14px}
.del-ask .btn{padding:6px 12px}
.del-ask .yes{background:var(--bad);border-color:var(--bad);color:#FFFFFF}
.no-service .del-btn{margin-left:auto;width:30px;height:30px;flex:none}
.no-service .del-btn svg{width:15px;height:15px}
.ns-wrap{display:flex;flex-direction:column;gap:8px}
.save-btn:disabled{opacity:.35;cursor:default}
.save-btn:not(:disabled){background:var(--accent);color:var(--accent-ink)}
.save-btn.busy{opacity:.6}
.admin-title b{font-size:15px;line-height:1.25}
.admin-title .sub{font-size:13px}
.admin-top .pill{flex:none}
.admin-row.locked select{opacity:.55}
.name-pick{display:flex;align-items:center;gap:10px}
.name-pick select{flex:1;min-width:0}
.av.face{width:36px;height:36px;font-size:12px}
.admin-row .name-pick .av.face{width:52px;height:52px;font-size:16px}
.admin-row .name-pick{gap:12px}
.av.face.empty{border:2px dashed var(--line);background:transparent}
.admin-row.locked .name-pick .av{opacity:.7}
.inline-check{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);vertical-align:-5px;box-sizing:border-box}
.inline-check svg{width:12px;height:12px}
.who{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.who b{font-weight:600;overflow-wrap:anywhere}
.av.xs{width:30px;height:30px;font-size:11px}
.warn-text{color:var(--warn)}
ol.steps{margin:-6px 0 0;padding:12px 16px 12px 36px;display:flex;flex-direction:column;gap:4px}
ol.steps li{padding-left:2px}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.admin-grid .field{gap:4px}
.admin-grid .field.wide{grid-column:1 / -1}
.admin-grid select{padding:7px 10px;min-height:38px}
.admin-grid label{font-size:12.5px}
.admin-grid .field{gap:3px}
.admin-grid select{font-size:14px}
a.btn{text-decoration:none}
.email-addr{margin:0;font-size:13px;user-select:all;overflow-wrap:anywhere}
.msgs{gap:8px}
.msg{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.msg-body{min-width:0;flex:1}
.msg-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.msg-top span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.msg p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg-del{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.linkbtn{background:none;border:none;padding:4px 0;margin-top:4px;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline}
.linkbtn.danger{color:var(--bad)}
.linkbtn.go-link{color:var(--ok)}
.wall-form{margin-bottom:10px}
.wall-emoji{font-size:30px;width:52px;text-align:center;flex:none}
.bday-row .av{width:52px;height:52px}
.no-service{display:flex;align-items:center;gap:8px;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:var(--r);padding:10px 14px;font-weight:700;margin-bottom:10px}
.bday-msg{margin:0;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-align:center}
.announce .thanks{margin-top:8px;font-weight:600}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center}

/* Cue card: one assignment */
.list{display:flex;flex-direction:column;gap:10px}
.cue{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:64px 1fr;overflow:hidden}
.cue.pending{border-color:var(--accent)}
.when{background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center}
.cue.pending .when{background:var(--accent);color:var(--accent-ink)}
.when .dow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}

.chip{border:1px solid var(--accent);background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.iconbtn:disabled{opacity:.35;cursor:default}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:96px;resize:vertical}
.field input:disabled{opacity:.6;cursor:not-allowed}
.field input[type="date"]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:44px;text-align:left}
.field input[type="date"]::-webkit-date-and-time-value{text-align:left}
.profile-hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.profile-hero h2{font-family:var(--display);font-size:28px;margin:0;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;margin:0}
.kv dt{color:var(--muted);font-size:13.5px}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere;user-select:text}

.likes-form .field{margin:0}
.done{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 16px}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:2px}
nav.tabs button{background:none;border:none;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;color:var(--muted);font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.02em;text-transform:uppercase;min-width:0}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.center-screen{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}

@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const spDate = v => v ? keyOf(new Date(v)) : "";              // SharePoint returns UTC instants for date-only columns
const toSp = k => k ? `${k}T12:00:00Z` : null;                // noon UTC: the same calendar day in every US time zone (the site is set to Pacific)
const todayKey = () => keyOf(new Date());
const addDays = (k, n) => { const d = fromKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const fmtLong = k => fromKey(k).toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric", year:"numeric"});
const fmtShort = k => fromKey(k).toLocaleDateString(undefined, {weekday:"short", month:"short", day:"numeric"});
const initials = n => (n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
const firstOf = n => (n||"").trim().split(/\s+/)[0] || "";
const lc = s => (s||"").toLowerCase();

let toastTimer;
function toast(msg, bad=false){
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, bad ? 6000 : 3200);
}

/* ---------- theme toggle (the original app's dark-mode switch) ---------- */
function currentDark(){
  const t = document.documentElement.getAttribute("data-theme");
  if (t) return t === "dark";
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
function toggleTheme(){
  const next = currentDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("rci-theme", next); } catch(e){}
  render();
}
try { const saved = localStorage.getItem("rci-theme"); if (saved) document.documentElement.setAttribute("data-theme", saved); } catch(e){}

/* ============================================================
   DATA LAYER — Graph (live) or in-memory sample (demo)
   ============================================================ */
function normalize(id, f, emailById){
  return {
    id: String(id),
    role: f.Title || "",
    date: spDate(f.ServiceDates),
    category: f.ServiceCategory || "",
    call: f.CallTime || "",
    svcTime: f.ServiceTime || "",
    fullName: f.ChoiceNames || "",
    email: lc(emailById ? emailById[f.PersonLookupId] : f.email),
    personId: f.PersonLookupId != null ? String(f.PersonLookupId) : (f.personId || ""),
    status: f.Status || "",
    published: f.Published || "",
    notes: f.Notes || "",
    first: f.Name || "",
    timeOff: spDate(f.TimeOffDate),
    birthday: spDate(f.Birthday),
    phone: f.PhoneNumber || "",
    photoRaw: f.Photo || "",
    serving: Array.isArray(f.Serving) ? f.Serving.slice() : [],
    gone: lc(f.ArchiveStatus) === "archived",
    active: f.ActiveStatus || "",
    likes: f[CONFIG.likesCol] || "",
    pendingEmail: (annText(f.Notes || "").match(/Pending sign-in:\s*([^<\s]+@[^<\s]+)/) || [])[1] || ""
  };
}

const LiveAPI = {
  msal: null, account: null, siteId: null, cache: new Map(),
  async init(){
    const msal = await import("https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/+esm");
    this.msal = new msal.PublicClientApplication({
      auth: { clientId: CONFIG.clientId,
              authority: "https://login.microsoftonline.com/" + (CONFIG.tenantId || "organizations"),
              redirectUri: location.origin + location.pathname },
      cache: { cacheLocation: "localStorage" }
    });
    await this.msal.initialize();
    const r = await this.msal.handleRedirectPromise();
    this.account = r?.account || this.msal.getAllAccounts()[0] || null;
    if (this.account) this.msal.setActiveAccount(this.account);
    return !!this.account;
  },
  signIn(){ return this.msal.loginRedirect({ scopes: SCOPES }); },
  signOut(){ return this.msal.logoutRedirect({ account: this.account }); },
  async token(){
    try { return (await this.msal.acquireTokenSilent({ scopes: SCOPES, account: this.account })).accessToken; }
    catch(e){ await this.msal.acquireTokenRedirect({ scopes: SCOPES }); throw e; }
  },
  async g(path, opts={}){
    const url = path.startsWith("https://") ? path : "https://graph.microsoft.com/v1.0" + path;
    const res = await fetch(url, { ...opts, headers: { Authorization: "Bearer " + await this.token(), ...(opts.headers||{}) } });
    if (!res.ok){
      let detail = ""; try { detail = (await res.json()).error?.message || ""; } catch(e){}
      const err = new Error(`${res.status} ${detail || res.statusText}`); err.status = res.status; throw err;
    }
    return opts.raw ? res : (res.status === 204 ? null : res.json());
  },
  async all(path){
    let out = [], next = path;
    while (next){ const j = await this.g(next); out = out.concat(j.value || []); next = j["@odata.nextLink"]; }
    return out;
  },
  async load(){
    const me = await this.g("/me?$select=displayName,mail,userPrincipalName");
    const site = await this.g(`/sites/${CONFIG.siteHost}:${CONFIG.sitePath}`);
    this.siteId = site.id;
    const base = `/sites/${this.siteId}/lists`;
    // Person column only returns a lookup id; the site's hidden user list maps it to an email.
    let emailById = {}, users = [];
    try {
      const uil = await this.all(`${base}/${encodeURIComponent("User Information List")}/items?$expand=fields($select=EMail,UserName,Title)&$top=999`);
      uil.forEach(u => {
        const email = u.fields.EMail || u.fields.UserName || "";
        emailById[u.id] = email;
        if (email && email.includes("@")) users.push({ id: String(u.id), email: lc(email), name: u.fields.Title || email });
      });
    } catch(e){ console.warn("Could not read User Information List; matching by name instead.", e); }
    const sel = `Title,ServiceDates,ServiceCategory,CallTime,ServiceTime,ChoiceNames,PersonLookupId,Status,Published,Notes,Name,TimeOffDate,Birthday,Photo,PhoneNumber,Serving,ArchiveStatus,ActiveStatus,${CONFIG.likesCol}`;
    const rows = await this.all(`${base}/${CONFIG.listId}/items?$expand=fields($select=${sel})&$top=500`); S.modById = new Map(rows.map(r => [String(r.id), { at: r.lastModifiedDateTime || "", by: lc(r.lastModifiedBy?.user?.email || ""), byName: r.lastModifiedBy?.user?.displayName || "" }]));   // who last changed each row, for Recent Replies
    let names = [], servingChoices = [], choices = {};
    try {
      const cols = await this.g(`${base}/${CONFIG.listId}/columns?$select=name,choice`);
      const ch = n => (cols.value.find(c => c.name === n)?.choice?.choices) || [];
      names = ch("ChoiceNames"); servingChoices = ch("Serving");
      choices = { status: ch("Status"), published: ch("Published") }; S.categories = ch("ServiceCategory");
    } catch(e){}
    return {
      me: { name: me.displayName || this.account.name || "", emails: [me.mail, me.userPrincipalName, this.account.username].filter(Boolean).map(lc) },
      items: rows.map(r => normalize(r.id, r.fields, emailById)),
      names, servingChoices, choices, users,
      messages: await this.messages(),
      announcements: await this.announcements()
    };
  },
  async messages(){
    try {
      const rows = await this.all(`/sites/${this.siteId}/lists/${CONFIG.messagesListId}/items?$expand=fields($select=Title,ToId,Message)&$top=500`);
      return rows.map(r => ({ id: String(r.id), toId: String(r.fields.ToId ?? ""), text: r.fields.Message || "",

  /* SharePoint's own API is needed for photos stored as row attachments (Graph can't read those). */
  spOff: false,
  async spToken(){

  flyer(a){
    const k = "flyer|" + a.id + "|" + a.flyer;
    if (!this.cache.has(k)) this.cache.set(k, (async () => {
      try {
        const f = JSON.parse(a.flyer), q = v => encodeURIComponent(String(v).replace(/'/g, "''"));
        if (f.serverRelativeUrl) return await this.spBlob(`GetFileByServerRelativeUrl('${q(f.serverRelativeUrl)}')/$value`);

    })());
    return this.cache.get(k);

  async spBlob(path){
    const tok = await this.spToken(); if (!tok) throw new Error("no SharePoint token");
    const res = await fetch(`https://${CONFIG.siteHost}${CONFIG.sitePath}/_api/web/${path}`, { headers: { Authorization: "Bearer " + tok } });
    if (!res.ok) throw new Error(res.status);
    return URL.createObjectURL(await res.blob());
  },
  photo(profile, email){
    const k = (profile?.id || "") + "|" + (profile?.photoRaw || "") + "|" + (email || "");
    if (!this.cache.has(k)) this.cache.set(k, (async () => {
      if (profile?.photoRaw){
        try {
          const p = JSON.parse(profile.photoRaw);
          const q = v => encodeURIComponent(String(v).replace(/'/g, "''"));
          if (p.serverRelativeUrl) return await this.spBlob(`GetFileByServerRelativeUrl('${q(p.serverRelativeUrl)}')/$value`);
          if (p.fileName) return await this.spBlob(`lists(guid'${CONFIG.listId}')/items(${profile.id})/AttachmentFiles('${q(p.fileName)}')/$value`);
        } catch(e){}

      if (email){

  /* Upload an image to the site's Site Assets library (where SharePoint keeps image-column files) and return the column value. */
  async assetImage(listId, fileName, blob){
    const drives = await this.g(`/sites/${this.siteId}/drives?$select=id,name,webUrl`);
    const assets = drives.value.find(d => /\/SiteAssets$/i.test(d.webUrl)) || drives.value.find(d => /site assets/i.test(d.name))
      // Graph leaves the system Site Assets library out of /drives; ask for it by name instead.
      || await this.g(`/sites/${this.siteId}/lists/${encodeURIComponent("Site Assets")}/drive?$select=id,name,webUrl`).catch(() => null);
    if (!assets) throw new Error("Couldn't find the site's Site Assets library.");
    const up = await this.g(`/drives/${assets.id}/root:/Lists/${listId}/${fileName}:/content`, {
      method: "PUT", headers: { "Content-Type": "image/jpeg" }, body: blob });
    const u = new URL(up.webUrl);
    return JSON.stringify({ type: "thumbnail", fileName, serverUrl: u.origin, serverRelativeUrl: decodeURIComponent(u.pathname) });
  },

    const fields = { Announcements: text, Title: text.replace(/\s*\n+\s*/g, " ").slice(0, 255) };
    if (until) fields.ShowUntil = until + "T12:00:00Z";      // noon UTC keeps the same calendar date everywhere

    }
    return a;

  async updateAnnouncement(id, { text, until, flyer, removeFlyer }){
    const url = `/sites/${this.siteId}/lists/${CONFIG.announcementsListId}/items/${id}/fields`;
    const fields = { Announcements: text, Title: text.replace(/\s*\n+\s*/g, " ").slice(0, 255), ShowUntil: until ? until + "T12:00:00Z" : null };

function birthdaysToday(){
  const t = todayKey(), md = t.slice(5), y = Number(t.slice(0,4));
  const leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  return S.items.filter(i => isProfile(i) && !i.gone && i.birthday && (i.birthday.slice(5) === md || (!leap && md === "02-28" && i.birthday.slice(5) === "02-29")))
    .sort((a,b) => a.fullName.localeCompare(b.fullName));
}

/* Confetti: phones only, once per day per device, skipped for reduced motion. */
function maybeConfetti(){
  if (!birthdaysToday().length) return;
  if (!matchMedia("(pointer: coarse)").matches && innerWidth > 820) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const key = "rci-confetti-" + todayKey();
  try { if (localStorage.getItem(key)) return; localStorage.setItem(key, "1"); } catch(e){}
  const c = document.createElement("canvas");
  c.setAttribute("aria-hidden", "true");
  c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50";
  document.body.appendChild(c);
  const ctx = c.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  const W = c.width = innerWidth * dpr, H = c.height = innerHeight * dpr;
  const colors = ["#D2B07C", "#BD9863", "#072442", "#FFFFFF", "#1E8A52", "#C62828", "#4A90D9"];
  const bits = Array.from({ length: 160 }, () => ({
    x: W/2 + (Math.random() - .5) * W * .3, y: H * .35,
    vx: (Math.random() - .5) * 16 * dpr, vy: (-Math.random() * 18 - 6) * dpr,
    w: (6 + Math.random() * 6) * dpr, h: (8 + Math.random() * 8) * dpr,
    r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, col: colors[Math.floor(Math.random() * colors.length)]
  }));
  const start = performance.now();
  (function frame(now){
    const age = now - start;
    ctx.clearRect(0, 0, W, H);
    bits.forEach(b => {
      b.vy += .45 * dpr; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, age - 2600) / 900);
      ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.col;
      ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h * Math.abs(Math.cos(b.r * 2)) + 2); ctx.restore();
    });
    if (age < 3500) requestAnimationFrame(frame); else c.remove();
  })(start);
}

/* Birthday wall: open from the person's birthday through CONFIG.wallDays days after; messages show for CONFIG.wallDays days. */
function lastBirthday(p){
  if (!p || !p.birthday) return null;
  const t = todayKey(), y = Number(t.slice(0,4)), md = p.birthday.slice(5);
  const occ = yr => { const leap = (yr % 4 === 0 && yr % 100 !== 0) || yr % 400 === 0; return `${yr}-${md === "02-29" && !leap ? "02-28" : md}`; };
  const k = occ(y);
  return k <= t ? k : occ(y - 1);
}
function wallOpen(p){ const b = lastBirthday(p); return !!b && addDays(b, CONFIG.wallDays) >= todayKey(); }
function wallMessages(p){
  const cutoff = Date.now() - CONFIG.wallDays * 864e5;
  return (S.messages || []).filter(m => m.toId === String(p.id) && m.text && new Date(m.at).getTime() >= cutoff).sort((a,b) => b.at.localeCompare(a.at));
}
function ago(iso){
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now"; if (mins < 60) return `${mins} min ago`;
  const h = Math.round(mins / 60); if (h < 24) return `${h} hr ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
/* "Get to Know Me": one "Question: answer" (or "Question? answer") per line. */
function parseLikes(text){
  const lines = String(text || "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const qa = [], extra = [];
  lines.forEach(l => {
    const m = l.match(/^(.{2,80}?[:?])\s*(.*)$/);
    if (m) qa.push({ q: m[1], a: m[2].trim() }); else extra.push(l);
  });
  if (!qa.length) CONFIG.likesTemplate.forEach(q => qa.push({ q, a: "" }));
  return { qa, extra: extra.join("\n") };
}
function likesLabel(q){ return q.replace(/:$/, ""); }
function likesSection(p){
  const { qa, extra } = parseLikes(p.likes);
  const filled = qa.filter(x => x.a);
  if (!filled.length && !extra) return `<section><h2 class="section-label">Get to Know ${esc(p.first || firstOf(p.fullName) || "Me")}</h2><div class="empty">Nothing shared yet.</div></section>`;
  return `<section><h2 class="section-label">Get to Know ${esc(p.first || firstOf(p.fullName) || "Me")}</h2><div class="panel"><dl class="kv likes">
    ${filled.map(x => `<dt>${esc(likesLabel(x.q))}</dt><dd>${esc(x.a)}</dd>`).join("")}
    ${extra ? `<dt>More</dt><dd style="white-space:pre-line">${esc(extra)}</dd>` : ""}</dl></div></section>`;
}
function wallSection(p){
  const msgs = wallMessages(p), open = wallOpen(p), own = myProfile()?.id === p.id;
  if (!open && !msgs.length) return "";
  const myEmails = S.me.emails;
  const list = msgs.map(m => {
    const sender = S.items.find(i => isProfile(i) && m.fromEmail && i.email === m.fromEmail) || { fullName: m.fromName, email: m.fromEmail };
    const mine = m.fromEmail && myEmails.includes(m.fromEmail);
    const del = mine ? (S.confirmMsg === m.id
      ? `<span class="msg-del">Delete this message? <button class="linkbtn danger" data-act="msg-delete" data-id="${m.id}">Yes, Delete</button> <button class="linkbtn" data-act="msg-keep">Keep It</button></span>`
      : `<button class="linkbtn" data-act="msg-ask" data-id="${m.id}">Delete</button>`) : "";
    return `<article class="msg">${avatar(sender, "sm")}<div class="msg-body"><div class="msg-top"><b>${esc(sender.fullName || "Team member")}</b><span>${esc(ago(m.at))}</span></div><p>${esc(m.text)}</p>${del}</div></article>`;
  }).join("");
  const compose = open && !own ? `<form class="panel stack wall-form" id="wallForm" data-id="${p.id}">
      <div class="field"><label for="wall-text">Write ${esc(p.first || firstOf(p.fullName))} A Birthday Message</label>
        <textarea id="wall-text" maxlength="500" placeholder="Happy birthday! 🎉" required></textarea></div>
      <button class="btn blue block" type="submit" id="wall-send">Post Message</button></form>` : "";
  return `<section id="wall"><h2 class="section-label">🎂 Birthday Wall ${msgs.length ? `<span class="count">${msgs.length}</span>` : ""}</h2>
    ${compose}
    ${list ? `<div class="list msgs">${list}</div>` : `<div class="empty">${own ? "No birthday messages yet." : "Be the first to leave a birthday message."}</div>`}
  </section>`;
}

/* The Announcements column can hold several lines; SharePoint may return it as plain text or simple HTML. */
function annText(v){
  if (!v) return "";
  if (!/<[a-z][\s\S]*>/i.test(v)) return v.trim();
  const d = new DOMParser().parseFromString(v.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li)>/gi, "\n"), "text/html");
  return (d.body.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
}

/* A day off from the Absence tab, shown like an assignment card, with Cancel under the TIME OFF pill. */
function absentCue(i){

function cue(i, opts={}){

    <div class="when"><span class="dow">${d.toLocaleDateString(undefined,{weekday:"short"})}</span><span class="day">${d.getDate()}</span><span class="mon">${d.toLocaleDateString(undefined,{month:"short"})}</span></div>

/* Next 7 Days: red count when something is on it that wasn't there the last time this person opened the app. */
function newUpCount(up){
  const key = "seen-up:" + location.pathname + ":" + ((S.me && S.me.emails && S.me.emails[0]) || "");

/* Rich-text notes from SharePoint: keep structure, drop scripts, styles and attributes. */
const KEEP = new Set(["P","DIV","BR","B","STRONG","I","EM","U","UL","OL","LI","H1","H2","H3","H4","TABLE","THEAD","TBODY","TR","TD","TH","SPAN","A","HR","BLOCKQUOTE"]);
function cleanHtml(raw){
  const doc = new DOMParser().parseFromString(`<div>${raw}</div>`, "text/html");
  const walk = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) return;
      if (n.nodeType !== 1 || /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|NOSCRIPT|TEMPLATE)$/.test(n.tagName)){ n.remove(); return; }
      walk(n);
      if (!KEEP.has(n.tagName)){ n.replaceWith(...n.childNodes); return; }
      const href = n.tagName === "A" ? n.getAttribute("href") : null;
      [...n.attributes].forEach(a => n.removeAttribute(a.name));
      if (href && /^https?:\/\//i.test(href)){ n.setAttribute("href", href); n.setAttribute("target","_blank"); n.setAttribute("rel","noopener"); }
    });
  };
  const root = doc.body.firstChild; walk(root);
  return root.innerHTML;
}

function personOptions(){
  // Team members first (from their 🎂 Birthday rows), then anyone else on the site.
  const seen = new Set(), out = [];
  S.items.filter(i => isProfile(i) && i.personId).sort((a,b) => a.fullName.localeCompare(b.fullName))
    .forEach(p => { if (!seen.has(p.personId)){ seen.add(p.personId); out.push({ id: p.personId, label: `${p.fullName} (${p.email || "no email"})` }); } });
  (S.users || []).slice().sort((a,b) => a.name.localeCompare(b.name))
    .forEach(u => { if (!seen.has(u.id)){ seen.add(u.id); out.push({ id: u.id, label: `${u.name} (${u.email})` }); } });
  return out;
}
function opts(list, cur, blank){
  const all = [...new Set([...(list || []), ...(cur ? [cur] : [])])];

/* Name Email follows Full Name: the person is found by name on the team (their 🎂 Birthday row) or the site's user list. */
function personForName(name){
  if (!name) return null;
  const prof = S.items.find(i => isProfile(i) && i.fullName === name && i.personId);
  if (prof) return { id: prof.personId, profile: prof };
  const u = (S.users || []).find(u => lc(u.name) === lc(name));
  return u ? { id: u.id, profile: S.items.find(i => isProfile(i) && i.personId === u.id) || { fullName: u.name, email: u.email } } : null;
}

/* Group positions under the CONFIG.sections headings (anything else goes under "Other"). */
function posRank(role){
  const r = lc((role || "").trim()); let n = 0;
  for (const [, roles] of CONFIG.sections){ for (const x of roles){ if (lc(x) === r) return n; n++; } }
  return 999;
}
function sectionOfRole(role){
  const r = lc((role || "").trim());
  const hit = CONFIG.sections.find(([, roles]) => roles.some(x => lc(x) === r));
  return hit ? hit[0] : "Other";
}
function bySection(list, html, scope = "admin"){
  const order = new Map(list.map((i, n) => [i.id, n]));
  const sorted = list.slice().sort((a, b) => (posRank(a.role) - posRank(b.role)) || (order.get(a.id) - order.get(b.id)));
  return [...CONFIG.sections.map(([h]) => h), "Other"].map(h => {
    const part = sorted.filter(i => sectionOfRole(i.role) === h);
    if (!part.length) return "";
    return h ? secBlock(`${scope}:${h}`, h, part.length, html(part)) : `<section class="role-sec">${html(part)}</section>`;
  }).join("");
}
/* Names offered for a position: people whose Serving tags include it ("Gimbal 2 Operator" also matches the
   "Gimbal Operator" tag). Archived people are left out. The name already on the row is always kept. */
function namesForRole(role, current, date){
  const off = new Set(S.items.filter(i => isAbsent(i) && i.date === date).map(i => lc(i.fullName || "")));
  const r = lc((role || "").trim()), r2 = r.replace(/\s+\d+\b/g, "");
  const tagged = S.items.filter(p => isProfile(p) && !p.gone && lc(p.active) !== "non active" && p.fullName && (p.serving || []).some(t => { const x = lc(t); return x === r || x === r2; }))
    .map(p => p.fullName).filter(n => !off.has(lc(n))).sort((a, b) => a.localeCompare(b));
  const list = [...new Set(tagged)];
  if (current && !list.includes(current)) list.unshift(current);
  return list;
}

/* ---------- red badge on the app icon for pending requests ---------- */
/* ---------- Admins: Recent Replies (who accepted or declined, newest first) ----------
   A reply is a schedule row whose Status is Accepted or Declined and which was last changed by that same person
   (not by an admin) in the last 14 days. "New" = since this admin last opened Home on this device. */
const REPLY_KEY = "replies-seen:" + location.pathname;
let repliesSeenAt = (() => { try { return Number(localStorage.getItem(REPLY_KEY) || 0); } catch(_){ return 0; } })();
function recentReplies(){
  if (!isEditor() || !S.modById) return [];
  const since = Date.now() - 14 * 864e5, out = [];
  for (const i of assignments()){
    const st = lc(i.status || ""); if (st !== "accepted" && st !== "declined") continue;
    const m = S.modById.get(String(i.rowId || i.id).split(":")[0]); if (!m || !m.at) continue;
    const at = Date.parse(m.at); if (!(at >= since)) continue;
    const byThem = (m.by && i.email && m.by === lc(i.email)) || (m.byName && i.fullName && lc(m.byName) === lc(i.fullName));
    if (!byThem) continue;
    out.push({ i, at, accepted: st === "accepted" });
  }
  for (const i of S.items){
    if (!isAbsent(i) || !i.date) continue;
    const mm = String(i.notes || "").replace(/<[^>]*>/g, " ").match(/Declined\s+([^<\n]+?)\s*$/i); if (!mm) continue;
    const m = S.modById.get(String(i.id)); if (!m || !m.at) continue;
    const at = Date.parse(m.at); if (!(at >= since)) continue;
    out.push({ i: { ...i, role: mm[1].trim() }, at, accepted: false });
  }
  return out.sort((a, b) => b.at - a.at).slice(0, 12);
}
const newReplyCount = () => recentReplies().filter(r => r.at > repliesSeenAt).length;
function replyAgo(ms){
  const m = Math.round((Date.now() - ms) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " hr ago";
  const d = Math.round(h / 24); return d === 1 ? "yesterday" : d + " days ago";
}
function repliesPanel(){
  // Only replies that came in since this admin last opened the app (like the NEW tag on announcements).
  const list = recentReplies().filter(r => r.at > repliesSeenAt); if (!isEditor() || !list.length) return "";
  const html = `<section><h2 class="section-label">Recent Replies <span class="count hot">${list.length}</span></h2>
    <div class="panel replies">${list.map(({ i, at, accepted }) => `<div class="reply-row">${avatar(i, "sm")}
      <div class="reply-info"><b>${esc(i.fullName || "Someone")}</b><small>${esc(i.role || "")}${i.role ? " · " : ""}${esc(fmtShort(i.date))} · ${esc(replyAgo(at))}</small></div>
      ${accepted ? `<span class="pill ok">CONFIRMED</span>` : `<span class="pill bad">DECLINED</span>`}</div>`).join("")}</div></section>`;
  try { localStorage.setItem(REPLY_KEY, String(Date.now())); } catch(_){}
  return html;
}

  const views = { admin: viewAdmin, directory: viewDirectory, home: viewHome, schedule: viewSchedule, calendar: viewCalendar, notes: viewNotes, team: viewTeam, member: viewMember, absence: viewAbsence, profile: viewProfile };
  if (!views[S.view]){ S.view = "home"; S.arg = null; }
  saveNav();
  const active = ["notes","team","member","admin"].includes(S.view) ? (S.stack[0]?.view || "home") : S.view;
  const demoBar = DEMO ? `<div class="demo"><span><strong>Demo mode.</strong> Sample people and dates; nothing is saved to SharePoint. Add your app's client ID in the configuration to connect the Serving Schedule list.</span></div>` : "";
  app.innerHTML = header + `<main><div class="wrap">${demoBar}${S.view === "home" ? installGuide() + badgePanel() : ""}${views[S.view]()}</div></main>
    <nav class="tabs" aria-label="Main"><div class="wrap">${TABS.map(([v,l,ic]) => `<button data-act="tab" data-view="${v}" ${v===active?'aria-current="page"':""}>${ic}<span>${l}</span></button>`).join("")}</div></nav>`;
  hydratePhotos(); hydrateFlyers();
}

/* Remember the page being viewed, so reloading the app (pull to refresh, the browser's reload, an update)
   comes back to the same page instead of Home. Kept for this tab/app window only. */
const NAV_KEY = "rci-nav:" + location.pathname;
const NAV_SKIP = { doc: "docs" };   // pages that can't be rebuilt on their own go to their parent
function saveNav(){
  try { sessionStorage.setItem(NAV_KEY, JSON.stringify({ view: S.view, arg: S.arg, stack: S.stack.slice(-10),
    adminDate: S.adminDate || null, adminExtra: S.adminExtra || null, calSel: S.cal.sel, calMonth: S.cal.month ? keyOf(S.cal.month) : null })); } catch(_){}
}
function restoreNav(){
  try {
    const n = JSON.parse(sessionStorage.getItem(NAV_KEY) || "null"); if (!n || !n.view) return;
    S.view = NAV_SKIP[n.view] || n.view; S.arg = NAV_SKIP[n.view] ? null : n.arg; S.stack = Array.isArray(n.stack) ? n.stack : [];
    if (n.adminDate) S.adminDate = n.adminDate; if (n.adminExtra) S.adminExtra = n.adminExtra;
    if (n.calSel) S.cal.sel = n.calSel; if (n.calMonth) S.cal.month = fromKey(n.calMonth);
  } catch(_){}
}
function go(view, arg=null, push=true){
  if (push) S.stack.push({ view: S.view, arg: S.arg });
  S.view = view; S.arg = arg; S.confirm = null; render(); window.scrollTo(0,0);
}

async function setStatus(item, accept){
  S.busy.add(item.id); render();
  const fields = accept ? { Status: "Accepted", Published: "Request Approved" } : { Status: "Declined", Published: "Request Denied" };
  try {
    if (!accept){
      // Declining: mark them Absent for that date (so Edit Schedule leaves them out of the name lists)
      // and open the position back up for someone else. The Absent row records the decline for Recent Replies.
      const note = `Declined ${item.role || "position"}`;
      const extra = { Title: "Time Off", TimeOffDate: toSp(item.date), Status: "Unavailable", Published: "--", ChoiceNames: item.fullName || null, Notes: note };
      if (item.personId) extra.PersonLookupId = String(item.personId);
      if (!S.items.some(i => isAbsent(i) && i.date === item.date && mine(i))){
        const id = await API.addRow(item.date, CONFIG.absentCategory, extra);
        const row = normalize(id, {}); Object.assign(row, { role: "Time Off", date: item.date, timeOff: item.date, category: CONFIG.absentCategory, status: "Unavailable", published: "--", fullName: item.fullName, email: item.email, personId: item.personId, notes: note });
        S.items.push(row);
      }
      await API.updateAssignment(item.id, { ChoiceNames: null, PersonLookupId: null, Status: "Pending", Published: "--" });
      Object.assign(item, { fullName: "", personId: "", email: "", status: "Pending", published: "--" });
      toast(`Declined: ${item.role}, ${fmtShort(item.date)}. You're marked absent that day.`);
      S.busy.delete(item.id); S.confirm = null; render(); updateBadge(); return;
    }
    await API.update(item.id, fields);
    item.status = fields.Status; item.published = fields.Published;
    toast(accept ? `Accepted: ${item.role}, ${fmtShort(item.date)}` : `Declined: ${item.role}, ${fmtShort(item.date)}`);
  } catch(e){ toast("Couldn't save your reply. " + e.message, true); }
  S.busy.delete(item.id); S.confirm = null; render(); updateBadge();
}

async function resizeImage(file, maxSide){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  const max = maxSide || 600, s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
}

/* ---------- Pull down at the top of any page to refresh ---------- */
(function(){
  const ind = document.createElement("div"); ind.id = "ptr"; ind.innerHTML = "<span>↓ Pull to refresh</span>";
  document.addEventListener("DOMContentLoaded", () => document.body.appendChild(ind));
  if (document.body) document.body.appendChild(ind);
  let y0 = null, h = 0;
  const editing = t => t && t.closest && t.closest("input,textarea,select,[contenteditable='true'],iframe,.date-chips,.grid7");
  addEventListener("touchstart", e => {
    y0 = (window.scrollY <= 0 && e.touches.length === 1 && !editing(e.target) && !editing(document.activeElement)) ? e.touches[0].clientY : null; h = 0;
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (y0 == null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy <= 0 || window.scrollY > 0){ ind.style.height = "0"; h = 0; return; }
    h = Math.min(dy * 0.5, 90); ind.style.height = h + "px";
    const ready = h >= 60; ind.classList.toggle("ready", ready);
    ind.firstChild.textContent = ready ? "↻ Release to refresh" : "↓ Pull to refresh";
  }, { passive: true });
  addEventListener("touchend", () => {
    if (y0 == null) return; y0 = null;
    if (h >= 60){ ind.firstChild.textContent = "Refreshing…"; ind.style.height = "48px"; setTimeout(() => location.reload(), 120); }
    else ind.style.height = "0";
    h = 0;
  });
})();

/* The site user id for an email (adds the person to the site's user list if needed). */
async function siteUserId(email){

/* Onboarding uses the signed-in leader's delegated permissions. No service keys. */
const Onboarding = {
  field: null, schemaError: '', details: new Map(), busy: new Set(), identities: new Map(),
  siteUrl(){ return `https://${CONFIG.siteHost}${CONFIG.sitePath}`; },
  email(p){ return (p.pendingEmail || p.email || '').trim().toLowerCase(); },
  writable(p){ return isProfile(p) && p.editable !== false && /^\d+$/.test(String(p.id)); },
  async schema(){
    if (this.field) return this.field;
    const cols = await API.g(`/sites/${API.siteId}/lists/${CONFIG.listId}/columns?$select=name,displayName,choice`);
    const col = cols.value.find(c => c.name === 'AccessStatus' || c.displayName === 'Access Status');
    if (!col || !['Pending','Complete','Failed'].every(v => col.choice?.choices?.includes(v)))
      throw new Error('The Access Status choice column must contain Pending, Complete, and Failed.');
    this.field = col.name; this.schemaError = ''; return this.field;
  },
  async load(items){
    if (DEMO) return;
    try {
      const field = await this.schema();
      const rows = await API.all(`/sites/${API.siteId}/lists/${CONFIG.listId}/items?$expand=fields($select=${field})&$top=500`);
      const statuses = new Map(rows.map(r => [String(r.id), r.fields[field]]));
      for (const p of items) p.accessStatus = statuses.get(String(p.id)) || '';
    } catch(e){ this.schemaError = e.message; }
  },
  async token(scopes, interactive=false){
    const request = { scopes, account: API.account };
    try { return (await API.msal.acquireTokenSilent(request)).accessToken; }
    catch(e){
      if (!interactive) throw new Error('Microsoft authorization is needed. Select Retry Setup as a site or team owner. ' + (e.errorCode || ''));
      return (await API.msal.acquireTokenPopup(request)).accessToken;
    }
  },
  async sp(path, opts={}, token){
    const bearer = token || await this.token([`https://${CONFIG.siteHost}/AllSites.FullControl`]);
    const res = await fetch(this.siteUrl() + '/_api/' + path, { ...opts, headers: {
      Authorization: 'Bearer ' + bearer, Accept: 'application/json;odata=nometadata',
      ...(opts.body ? {'Content-Type':'application/json;odata=verbose'} : {}), ...(opts.headers || {})
    }});
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok){ const e = new Error(body?.error?.message?.value || body?.error?.message || `SharePoint returned ${res.status}.`); e.status = res.status; throw e; }
    return body?.d ?? body;
  },
  async graph(path, opts={}, token){
    const res = await fetch('https://graph.microsoft.com/v1.0' + path, { ...opts, headers:{
      Authorization:'Bearer ' + token, 'Content-Type':'application/json', ...(opts.headers || {})
    }});
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok){ const e = new Error(body?.error?.message || `Microsoft returned ${res.status}.`); e.status=res.status; e.code=body?.error?.code; throw e; }
    return body;
  },
  async graphAll(path, token){
    let out=[];
    while(path){ const data=await this.graph(path,{},token); out.push(...(data.value || []));
      const next=data['@odata.nextLink'];
      if(next && !next.startsWith('https://graph.microsoft.com/v1.0/')) throw new Error('Unexpected Microsoft paging address.');
      path=next ? next.slice('https://graph.microsoft.com/v1.0'.length) : null;
    }
    return out;
  },
  async status(p, value, detail=''){
    await API.update(p.id, { [await this.schema()]: value });
    p.accessStatus=value; this.details.set(String(p.id),detail);
    const current=S.items.find(i=>String(i.id)===String(p.id)); if(current) current.accessStatus=value;
  },
  hasPermissions(data, mask){
    const p=data?.GetUserEffectivePermissions || data?.getUserEffectivePermissions || data;
    if(p?.Low == null) return false;
    return (BigInt(p.Low) & BigInt(mask)) === BigInt(mask);
  },
  userQuery(login){ return '?@u=' + encodeURIComponent("'" + login.replace(/'/g,"''") + "'"); },
  listPath(id){
    if(!/^[a-f\d-]{36}$/i.test(id)) throw new Error('Invalid list identity.');
    return `web/lists(guid'${id}')`;
  },
  async directory(email, create=false, suppliedToken){
    if(this.identities.has(email)) return this.identities.get(email);
    const token=suppliedToken || await this.token(['User.ReadBasic.All', ...(create?['User.Invite.All']:[])],create);
    const quoted=email.replace(/'/g,"''");
    const users=await this.graphAll('/users?$select=id,mail,userPrincipalName&$filter='+encodeURIComponent(`mail eq '${quoted}' or userPrincipalName eq '${quoted}'`),token);
    if(users.length>1) throw new Error('More than one Microsoft account matches this email. A team owner must resolve it.');
    let user=users[0];
    if(!user && create){
      if(email.endsWith('@therampchurch.com')) throw new Error('This church account does not exist in Microsoft yet. Create the account first.');
      const invitation=await this.graph('/invitations',{method:'POST',body:JSON.stringify({invitedUserEmailAddress:email,invitedUserType:'Guest',
        inviteRedirectUrl:location.origin+location.pathname+'?install',sendInvitationMessage:true})},token);
      if(!invitation?.invitedUser?.id) throw new Error('Microsoft did not return the invited guest account.');
      user=await this.graph(`/users/${encodeURIComponent(invitation.invitedUser.id)}?$select=id,mail,userPrincipalName`,{},token);
    }
    if(user){
      if(!user.id || !user.userPrincipalName) throw new Error('Microsoft did not return an exact sign-in identity.');
      this.identities.set(email,user);
    }
    return user || null;
  },
  async user(email, token){
    const identity=await this.directory(email);
    if(!identity) return null;
    // Resolve the authoritative directory principal, never a fuzzy email/name match.
    const user=await this.sp('web/ensureuser',{method:'POST',body:JSON.stringify({logonName:identity.userPrincipalName})},token);
    const login=String(user?.LoginName || '').split('|').pop().toLowerCase();
    if(login !== identity.userPrincipalName.toLowerCase()){
      const error=new Error('SharePoint resolved a different account. The sign-in link was not accepted.'); error.identityMismatch=true; throw error;
    }
    return user;
  },
  async verify(p, token, repair=false){
    const email=this.email(p); if(!email) return {complete:false,detail:'An email address is needed to check access.'};
    let user;
    try { user=await this.user(email,token); }
    catch(e){ if(e.status===400 || e.status===404) return {complete:false,detail:'Waiting for Microsoft to make the account available.'}; throw e; }
    if(!user) return {complete:false,detail:'Waiting for a Microsoft guest invitation and account setup.'};
    if(!user.Id || !user.LoginName) throw new Error('Microsoft did not return a linked account.');
    const q=this.userQuery(user.LoginName);
    const web=await this.sp('web/getusereffectivepermissions(@u)' + q,{},token);
    if(!this.hasPermissions(web,65536)) return {complete:false,detail:'The account cannot open the team site yet.',user};
    const required=[{id:CONFIG.listId,mask:7,label:'schedule and roster'}];
    if(CONFIG.announcementsListId) required.push({id:CONFIG.announcementsListId,mask:1,label:'announcements'});
    if(CONFIG.messagesListId) required.push({id:CONFIG.messagesListId,mask:3,label:'birthday messages'});
    for(const list of required){
      const effective=await this.sp(this.listPath(list.id)+'/getusereffectivepermissions(@u)'+q,{},token);
      if(!this.hasPermissions(effective,list.mask)) {
        if (repair && !CONFIG.onboardingChannel) {
          // Preserve unique permissions. Add only this roster member, never reset inheritance.
          const role=await this.sp(`web/roledefinitions/getbytype(${list.mask===1?2:3})?$select=Id`,{},token);
          if(!role?.Id) throw new Error('The required SharePoint permission level could not be found.');
          await this.sp(this.listPath(list.id)+`/roleassignments/addroleassignment(principalid=${Number(user.Id)},roledefid=${Number(role.Id)})`,{method:'POST'},token);
          const confirmed=await this.sp(this.listPath(list.id)+'/getusereffectivepermissions(@u)'+q,{},token);
          if(!this.hasPermissions(confirmed,list.mask)) throw new Error(`Microsoft did not confirm permission for ${list.label}.`);
        } else return {complete:false,detail:`The account needs permission for ${list.label}. ${CONFIG.onboardingChannel?'Teams may still be syncing membership.':'Select Retry Setup to repair access.'}`,user};
      }
    }
    return {complete:true,detail:'Site and required list access verified. New guests must still accept their invitation and sign in.',user};
  },
  async link(p,user){
    if(!user?.Id) return;
    const key=API.col?.Name ? API.col.Name+'LookupId' : LINK_COL;
    // Keep the onboarding email; a directory lookup is not evidence of access.
    await API.update(p.id,{[key]:String(user.Id)});
    p.personId=String(user.Id); p.email=this.email(p);
  },
  async share(email,token){
    const group=await this.sp('web/associatedmembergroup?$select=Id',{},token);
    if(!group?.Id) throw new Error('The site has no Members group. A site owner must configure it.');
    const data=await this.sp('SP.Web.ShareObject',{method:'POST',body:JSON.stringify({
      url:this.siteUrl(),peoplePickerInput:JSON.stringify([{Key:email}]),roleValue:'group:'+group.Id,
      groupId:0,propagateAcl:false,sendEmail:true,includeAnonymousLinkInEmail:false,
      emailSubject:`Access to ${APP_NAME}`,
      emailBody:`You have been added to ${APP_NAME}. Accept this invitation, then open ${location.origin + location.pathname}?install to add the app to your home screen and sign in.`
    })},token);
    const result=data?.ShareObject || data;
    // A 200 response can contain a rejected invitation. Require explicit success.
    if(!result || Number(result.StatusCode)!==0 || result.ErrorMessage)
      throw new Error(result?.ErrorMessage || 'Microsoft did not confirm that site sharing succeeded.');
  },
  async channel(token){
    const cfg=CONFIG.onboardingChannel;
    const channels=await this.graphAll(`/teams/${cfg.teamId}/channels?$select=id,displayName,membershipType`,token);
    const matches=channels.filter(c=>c.displayName===cfg.name && c.membershipType==='private');
    if(matches.length!==1) throw new Error('The configured private Teams channel could not be identified uniquely.');
    return `/teams/${cfg.teamId}/channels/${encodeURIComponent(matches[0].id)}/members`;
  },
  async channelGrant(email,token){
    const cfg=CONFIG.onboardingChannel;
    const user=await this.directory(email,true,token);
    const body=JSON.stringify({'@odata.type':'#microsoft.graph.aadUserConversationMember',roles:[],
      'user@odata.bind':`https://graph.microsoft.com/v1.0/users('${user.id}')`});
    const teamPath=`/teams/${cfg.teamId}/members`;
    const members=await this.graphAll(teamPath,token);
    if(!members.some(m=>m.userId===user.id)) { await this.graph(teamPath,{method:'POST',body},token); await new Promise(resolve=>setTimeout(resolve,2000)); }
    const path=await this.channel(token);
    const channelMembers=await this.graphAll(path,token);
    if(!channelMembers.some(m=>m.userId===user.id)) await this.graph(path,{method:'POST',body},token);
    const confirmed=await this.graphAll(path,token);
    if(!confirmed.some(m=>m.userId===user.id)) throw new Error('Microsoft has not confirmed channel membership yet.');
  },
  async run(p,grant=false){
    if(DEMO || !isEditor() || !this.writable(p) || p.gone) return;
    const id=String(p.id), prior=p.accessStatus; if(this.busy.has(id)) return; this.busy.add(id);
    try {
      await this.schema();
      const email=this.email(p); if(!email) throw new Error('Add the person’s sign-in email before setting up access.');
      await this.status(p,'Pending','Checking Microsoft access…');
      const spToken=await this.token([`https://${CONFIG.siteHost}/AllSites.FullControl`],grant);
      let check=await this.verify(p,spToken,true);
      if(!check.complete && grant){
        if(CONFIG.onboardingChannel){
          const graphToken=await this.token(['User.ReadBasic.All','User.Invite.All','TeamMember.Read.All','TeamMember.ReadWriteNonOwnerRole.All','ChannelMember.ReadWrite.All','Channel.ReadBasic.All'],true);
          await this.channelGrant(email,graphToken);
        } else {
          if (!check.user || check.detail === 'The account cannot open the team site yet.') {
            const identity=await this.directory(email,true);
            await this.share(identity.userPrincipalName,spToken);
          }
        }
        check=await this.verify(p,spToken,true);
      }
      if(check.complete && check.user) await this.link(p,check.user);
      const identity=await this.directory(email);
      const awaitingSignIn=check.complete && /#ext#@/i.test(identity?.userPrincipalName || '') && prior!=='Complete';
      await this.status(p,check.complete && !awaitingSignIn?'Complete':'Pending',awaitingSignIn
        ? 'Access granted. Waiting for this guest to accept the invitation and sign in to the app.' : check.detail);
    } catch(e){
      if(e.identityMismatch) { try { await API.update(p.id,{[API.col?.Name ? API.col.Name+'LookupId' : LINK_COL]:null}); p.personId=''; } catch(_){} }
      this.details.set(id,e.message);
      try { await this.status(p,'Failed',e.message); }
      catch(saveError){ this.details.set(id,`${e.message} Status could not be saved: ${saveError.message}`); this.schemaError=saveError.message; }
    } finally { this.busy.delete(id); }
  },
  async confirmSelf(){
    if(DEMO || !S.me || this.schemaError) return;
    const normal=value=>String(value || '').trim().toLowerCase();
    const myEmails=new Set(S.me.emails.map(normal));
    // Use exact email/UPN matching, never a display name, to confirm a first sign-in.
    let profiles=S.items.filter(p=>this.writable(p) && !p.gone && (myEmails.has(normal(this.email(p))) || (!this.email(p) && myEmails.has(normal(p.email)))));
    if(!profiles.length){
      // Guest sessions may omit their original email. SharePoint's authenticated
      // current-user ID is authoritative and matches the roster's person lookup.
      try {
        const current=await this.sp('web/currentuser?$select=Id,LoginName');
        if(current?.Id) profiles=S.items.filter(p=>this.writable(p) && !p.gone && String(p.personId)===String(current.Id));
      } catch(e){ return; }
    }
    if(profiles.length!==1 || profiles[0].accessStatus==='Complete') return;
    const p=profiles[0];
    try {
      for(const id of [CONFIG.listId,CONFIG.announcementsListId,CONFIG.messagesListId].filter(Boolean))
        await API.g(`/sites/${API.siteId}/lists/${id}/items?$top=1&$select=id`);
      // This write also proves that the actual signed-in account can update its roster.
      await this.status(p,'Complete','First app sign-in and required list access verified.');
    } catch(e){ this.details.set(String(p.id),'Sign-in succeeded, but required list access could not be confirmed: '+e.message); }
  },
  flag(p){
    if(!isEditor() || !this.writable(p) || p.accessStatus==='Complete') return '';
    const st=['Pending','Complete','Failed'].includes(p.accessStatus)?p.accessStatus:'Pending';
    const label=st==='Complete'?'✓ Access Complete':st==='Failed'?'! Access Failed':'Access Pending';
    return `<span class="access-flag ${st.toLowerCase()}" role="status" title="Access Status: ${st}">${label}</span>`;
  },
  panel(p){
    if(!isEditor() || !this.writable(p)) return '';
    if(p.accessStatus==='Complete') return '';   // shown only as the green flag on the photo card
    const status=['Pending','Complete','Failed'].includes(p.accessStatus)?p.accessStatus:'Pending';
    const id=String(p.id), busy=this.busy.has(id);
    const detail=this.schemaError || this.details.get(id) || (p.accessStatus==='Complete'
      ? 'Microsoft access and onboarding are complete.'
      : p.accessStatus==='Failed' ? 'Setup failed. Select Retry Setup to see the Microsoft error and retry.'
      : 'Access has not been verified yet. Select Check Access, or Retry Setup to grant access.');
    return `<section class="panel stack access-box" aria-label="Access status">
      <p class="hint" style="margin:0">${esc(detail)}</p><p class="hint" style="margin:0">${esc(this.email(p) || 'No sign-in email recorded.')}</p>
      ${p.gone?'':`<div class="actions"><button class="btn" data-act="access-check" data-id="${esc(id)}" ${busy?'disabled':''}>Check Access</button><button class="btn blue" data-act="access-setup" data-id="${esc(id)}" ${busy?'disabled':''}>${busy?'Checking…':'Retry Setup'}</button><button class="btn share-app" data-act="share-app">${ICON.share}Share App</button></div>`}</section>`;
  },
  async action(id,grant,email){
    if(!isEditor()) return;
    const p=S.items.find(i=>String(i.id)===String(id)) || S.items.find(i=>this.writable(i) && this.email(i)===lc(email));
    if(!p) { toast('Open the person’s roster profile to set up access.',true); return; }
    if(!this.email(p)){
      const value=(prompt('Their Microsoft sign-in email address:','')||'').trim().toLowerCase();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return;
      // Existing roster records may predate onboarding. Persist the email before retrying.
      const fields=LINK_COL==='PersonLookupId' ? {Notes:'Pending sign-in: '+value} : {Title:value};
      await API.update(p.id,fields); p.pendingEmail=value;
    }
    const work=this.run(p,grant); render(); await work; render();
    toast(this.details.get(String(p.id)) || 'Access status updated.',p.accessStatus==='Failed');
  }
};

async function start(){
  S.phase = "boot"; render();
  try {
    const signedIn = await API.init();
    if (!signedIn){ S.phase = "signin"; render(); return; }
    const data = await API.load();
    await Onboarding.load(data.items);
    S.me = data.me; S.items = data.items; S.names = [...new Set([...(data.names || []), ...data.items.filter(isProfile).map(i => i.fullName).filter(Boolean)])];   // Roster names added in the app aren't Full Name choices yet
    S.servingChoices = data.servingChoices || []; S.choices = data.choices || {}; S.users = data.users || []; S.announcements = data.announcements || []; markNewAnns(); setTimeout(linkPendingPeople, 1500); S.messages = data.messages || [];
    const t = new Date(); S.cal.month = new Date(t.getFullYear(), t.getMonth(), 1); S.cal.sel = todayKey();
    restoreNav();
    await Onboarding.confirmSelf();
    S.phase = "ready"; render(); maybeConfetti(); updateBadge(); loadAdmins();
    void Push.init();
  } catch(e){
    console.error(e); S.error = e.message || String(e); S.phase = "error"; render();
  }
}
start();

/* When someone comes back to an app that's already open, check for a newer version and refresh to it,
   unless they're in the middle of editing something. */
let lastVersionCheck = 0;
async function checkForUpdate(){
  if (DEMO || Date.now() - lastVersionCheck < 30000) return;
  lastVersionCheck = Date.now();
  try {
    const text = await fetch("index.html?v=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.text() : "");
    const live = (text.match(/APP_VERSION = "([^"]+)"/) || [])[1];
    if (!live || live === APP_VERSION) return;
    const busy = S.annEdit || S.notesEdit || document.querySelector("#wall-text, #ab-notes, #ann-text")?.value;
    if (busy){ toast("A new version of the app is ready. It will load next time you open it."); return; }
    navigator.serviceWorker?.getRegistration().then(r => r && r.update()).catch(() => {});
    location.reload();
  } catch(e){}
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible") checkForUpdate();
  if (document.visibilityState !== "visible" || S.phase !== "ready" || DEMO) return;
  try { S.announcements = await LiveAPI.announcements(); S.messages = await LiveAPI.messages(); if (S.view === "home" || S.view === "member") render(); } catch(e){}
  updateBadge();
});
</script>
</body>
